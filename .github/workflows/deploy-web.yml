name: Test & deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Export web build
        env:
          EXPO_BASE_URL: /fork
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_FORK_API_URL: https://gwruqdpbugqjrkyfvipa.supabase.co/functions/v1/analyze-decision
          EXPO_PUBLIC_FORK_API_KEY: ${{ secrets.EXPO_PUBLIC_FORK_API_KEY }}
        run: |
          npx expo export --platform web
          # Single-page app: serve index.html for deep links, and skip Jekyll.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
